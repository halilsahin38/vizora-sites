<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0} .l{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;font-family:"Inter Display",Inter,sans-serif}
/* A: gradient monogram */
#a{background:radial-gradient(circle at 30% 25%,#2b3f6e 0%,#14213d 55%,#0b1326 100%)}
#a .ring{position:absolute;width:760px;height:760px;border-radius:50%;border:14px solid rgba(232,103,60,.9);border-right-color:transparent;transform:rotate(-30deg)}
#a .v{font-size:560px;font-weight:800;color:#fff;letter-spacing:-.05em;line-height:1;margin-top:-30px}
#a .v span{color:#e8673c}
/* B: warm wordmark */
#b{background:#f6f1ea}
#b .mark{width:300px;height:300px;border-radius:80px;background:#14213d;display:flex;align-items:center;justify-content:center;font-size:230px;font-weight:800;color:#fff;letter-spacing:-.05em;position:relative}
#b .mark:after{content:"";position:absolute;right:46px;top:46px;width:56px;height:56px;border-radius:28px;background:#e8673c}
#b .w{font-size:150px;font-weight:800;color:#14213d;letter-spacing:-.03em;margin-top:60px}
#b .s{font-size:44px;font-weight:600;color:#d9542b;letter-spacing:.24em;text-transform:uppercase;margin-top:10px}
/* C: bold orange */
#c{background:linear-gradient(145deg,#f0875f 0%,#d9542b 60%,#b8431f 100%)}
#c .v{font-size:600px;font-weight:800;color:#fff;letter-spacing:-.05em;line-height:1;text-shadow:0 30px 60px rgba(0,0,0,.18)}
#c .dot{position:absolute;width:120px;height:120px;border-radius:60px;background:#14213d;right:250px;top:250px}
</style></head><body>
<div class="l" id="a"><div class="ring"></div><div class="v">V<span>.</span></div></div>
<div class="l" id="b"><div class="mark">V</div><div class="w">Vizora</div><div class="s">Digital guides</div></div>
<div class="l" id="c"><div class="dot"></div><div class="v">V</div></div>
</body></html>
